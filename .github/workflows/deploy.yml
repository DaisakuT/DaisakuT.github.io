# サイトを GitHub Pages に公開するワークフロー。
# main ブランチに変更が入るたびに自動で走ります。

name: サイトを公開

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # 「記事の自動生成」から呼び出すため

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ビルド
        uses: withastro/action@v6
        with:
          node-version: "22"
        env:
          # 公開先のURL。ドメインを変える場合はこの行だけ書き換えてください。
          SITE_URL: https://blog.telass.jp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
