<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="500" fill="#F2F4F3" />

  <!-- 構造ベースライン・グリッド -->
  <line x1="100" y1="250" x2="1100" y2="250" stroke="#CDD5D6" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="425" y1="120" x2="425" y2="380" stroke="#CDD5D6" stroke-width="1.5" />
  <line x1="775" y1="120" x2="775" y2="380" stroke="#CDD5D6" stroke-width="1.5" />

  <!-- プロセス矢印コネクタ -->
  <path d="M 400 250 L 450 250 M 440 242 L 450 250 L 440 258" stroke="#14495B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 750 250 L 800 250 M 790 242 L 800 250 L 790 258" stroke="#14495B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 第1ステージ: サウナ（熱・蒸気） -->
  <g transform="translate(250, 230)">
    <!-- 外枠円 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#CDD5D6" stroke-width="2" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#D9A227" stroke-width="3" stroke-dasharray="12 6" />
    <!-- 熱源コア -->
    <circle cx="0" cy="20" r="35" fill="#D9A227" />
    <!-- 上昇する幾何学蒸気 -->
    <path d="M -25 -10 Q -15 -35 -25 -60" stroke="#14495B" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 0 -20 Q 10 -45 0 -70" stroke="#14495B" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 25 -10 Q 35 -35 25 -60" stroke="#14495B" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- 第2ステージ: 名水（地下水・急冷） -->
  <g transform="translate(600, 230)">
    <!-- 外枠円 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#CDD5D6" stroke-width="2" />
    <!-- 水面と波紋 -->
    <circle cx="0" cy="0" r="75" fill="#14495B" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#CDD5D6" stroke-width="3" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#F2F4F3" stroke-width="3" />
    <!-- 水滴/流下モチーフ -->
    <path d="M 0 -60 L 15 -30 C 15 -20 -15 -20 -15 -30 Z" fill="#D9A227" />
    <line x1="0" y1="15" x2="0" y2="60" stroke="#F2F4F3" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 第3ステージ: 絶景（外気浴・桜島・解放） -->
  <g transform="translate(950, 230)">
    <!-- 外枠円 -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#CDD5D6" stroke-width="2" />
    <!-- 背景の太陽/光 -->
    <circle cx="0" cy="-30" r="45" fill="#D9A227" />
    <!-- 桜島・山岳の幾何学シルエット -->
    <polygon points="-70,50 0,-20 70,50" fill="#14495B" />
    <polygon points="-20,50 0,15 20,50" fill="#CDD5D6" />
    <!-- 風・外気の広がりライン -->
    <path d="M -60 -50 C -20 -70 20 -70 60 -50" stroke="#14495B" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M -40 -30 C -10 -45 10 -45 40 -30" stroke="#F2F4F3" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- ラベルテキスト（合計7文字） -->
  <text x="250" y="390" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10171C">サウナ</text>
  <text x="600" y="390" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10171C">名水</text>
  <text x="950" y="390" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10171C">絶景</text>

  <!-- ステップ番号装飾 -->
  <text x="250" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D9A227">01</text>
  <text x="600" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#14495B">02</text>
  <text x="950" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D9A227">03</text>
</svg>