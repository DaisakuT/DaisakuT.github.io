<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#F2F4F3"/>

  <!-- Step 1 Container -->
  <rect x="80" y="60" width="300" height="380" rx="16" fill="#FFFFFF" stroke="#CDD5D6" stroke-width="2"/>
  <circle cx="130" cy="110" r="20" fill="#14495B"/>
  <text x="130" y="117" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F2F4F3" text-anchor="middle">1</text>
  
  <!-- Step 1 Graphic: Alignment -->
  <g transform="translate(230, 240)">
    <!-- Pan Base -->
    <path d="M -90,70 L 90,70" stroke="#CDD5D6" stroke-width="6" stroke-linecap="round"/>
    <!-- Dumplings aligned -->
    <path d="M -75,60 C -75,25 -35,25 -35,60 Z" fill="#14495B"/>
    <path d="M -20,60 C -20,25 20,25 20,60 Z" fill="#14495B"/>
    <path d="M 35,60 C 35,25 75,25 75,60 Z" fill="#14495B"/>
    <!-- Snowflake/Frozen dot cues -->
    <circle cx="-55" cy="10" r="4" fill="#CDD5D6"/>
    <circle cx="0" cy="0" r="5" fill="#CDD5D6"/>
    <circle cx="55" cy="10" r="4" fill="#CDD5D6"/>
  </g>
  <text x="230" y="400" font-family="sans-serif" font-size="24" font-weight="bold" fill="#10171C" text-anchor="middle">並べる</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 400,250 L 425,250" stroke="#CDD5D6" stroke-width="4" stroke-linecap="round"/>
  <polygon points="425,243 437,250 425,257" fill="#CDD5D6"/>

  <!-- Step 2 Container -->
  <rect x="450" y="60" width="300" height="380" rx="16" fill="#FFFFFF" stroke="#CDD5D6" stroke-width="2"/>
  <circle cx="500" cy="110" r="20" fill="#14495B"/>
  <text x="500" y="117" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F2F4F3" text-anchor="middle">2</text>

  <!-- Step 2 Graphic: Steaming -->
  <g transform="translate(600, 240)">
    <!-- Lid Dome -->
    <path d="M -85,60 C -85,-10 85,-10 85,60" fill="none" stroke="#CDD5D6" stroke-width="4" stroke-dasharray="6 6"/>
    <rect x="-10" y="-20" width="20" height="10" rx="3" fill="#CDD5D6"/>
    <!-- Pan Base -->
    <path d="M -90,70 L 90,70" stroke="#CDD5D6" stroke-width="6" stroke-linecap="round"/>
    <!-- Dumpling inside -->
    <path d="M -45,60 C -45,15 45,15 45,60 Z" fill="#14495B"/>
    <!-- Steam waves -->
    <path d="M -30,0 C -35,-15 -25,-25 -30,-40" fill="none" stroke="#D9A227" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,5 C -5,-10 5,-20 0,-35" fill="none" stroke="#D9A227" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30,0 C 25,-15 35,-25 30,-40" fill="none" stroke="#D9A227" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="600" y="400" font-family="sans-serif" font-size="24" font-weight="bold" fill="#10171C" text-anchor="middle">蒸し焼き</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 770,250 L 795,250" stroke="#CDD5D6" stroke-width="4" stroke-linecap="round"/>
  <polygon points="795,243 807,250 795,257" fill="#CDD5D6"/>

  <!-- Step 3 Container -->
  <rect x="820" y="60" width="300" height="380" rx="16" fill="#FFFFFF" stroke="#D9A227" stroke-width="3"/>
  <circle cx="870" cy="110" r="20" fill="#D9A227"/>
  <text x="870" y="117" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F2F4F3" text-anchor="middle">3</text>

  <!-- Step 3 Graphic: Crispy Finish -->
  <g transform="translate(970, 240)">
    <!-- Pan Base -->
    <path d="M -90,70 L 90,70" stroke="#14495B" stroke-width="6" stroke-linecap="round"/>
    <!-- Crisp Base (Golden Wing) -->
    <path d="M -75,68 L 75,68 L 65,56 L -65,56 Z" fill="#D9A227"/>
    <!-- Dumpling Body -->
    <path d="M -50,56 C -50,10 50,10 50,56 Z" fill="#14495B"/>
    <!-- Crispy Texture Rays / Sparks -->
    <line x1="-70" y1="56" x2="-85" y2="45" stroke="#D9A227" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="56" x2="85" y2="45" stroke="#D9A227" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,-15 L 0,-30 M -12,-22 L 12,-22" stroke="#D9A227" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-40" cy="-10" r="4" fill="#D9A227"/>
    <circle cx="40" cy="-10" r="4" fill="#D9A227"/>
  </g>
  <text x="970" y="400" font-family="sans-serif" font-size="24" font-weight="bold" fill="#10171C" text-anchor="middle">パリッと</text>
</svg>